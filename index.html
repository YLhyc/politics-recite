<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- PWA & Apple Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="政治带背">
  <meta name="theme-color" content="#3e261b">
  <meta name="format-detection" content="telephone=no">
  <title>考研政治每日带背伴侣 | 2027精读音频精确定位</title>
  <style>
    :root {
      --bg-paper: #f7f3e8;
      --bg-card: #fdfaf3;
      --bg-para: #faf6ed;
      --bg-para-active: #fffdf9;
      --text-main: #2c241d;
      --text-sub: #5c4d3f;
      --text-light: #877665;
      --brown-main: #705844;
      --brown-dark: #4d3a2b;
      --brown-soft: #f4eee2;
      --brown-border: #e3d7c5;
      --vermilion: #a6402a;
      --vermilion-soft: #fcf4f0;
      --vermilion-border: #f2d1c9;
      --indigo: #204b66;
      --border-color: #e5ded0;
      --border-para: #ebe5d8;
      --shadow-card: 0 2px 10px rgba(44, 33, 22, 0.05);
      --shadow-active: 0 6px 20px rgba(179, 57, 47, 0.12);
      --font-serif: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      position: relative;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: var(--font-scale, 16px);
      line-height: var(--font-line-height, 1.85);
      -webkit-font-smoothing: antialiased;
      padding-top: calc(var(--safe-top) + 54px);
      padding-bottom: calc(136px + var(--safe-bottom));
      min-height: 100vh;
      box-sizing: border-box;
      -webkit-text-size-adjust: 100%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* 原生 SVG 矢量图标规范与设计对齐 */
    .svg-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .svg-stroke-brown {
      stroke: var(--brown-main);
      fill: none;
    }

    .svg-fill-brown {
      fill: var(--brown-main);
      stroke: none;
    }

    /* 顶部导航 - 稳固 Fixed 布局，彻底消除位置不固定 */
    .header-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(248, 246, 240, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: calc(var(--safe-top) + 6px) 10px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: calc(var(--safe-top) + 54px);
      box-sizing: border-box;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      flex: 1;
      min-width: 0;
      margin-right: 6px;
    }

    .header-badge {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--brown-main);
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-day-select {
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: var(--font-serif);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 100%;
      text-align: left;
    }

    .header-day-select span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 顶栏操作按钮组：针对移动端极限 375px 紧凑优化，保证绝不溢出 */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-header {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--brown-main);
      border-radius: 12px;
      padding: 4px 6px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2.5px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .btn-header:active {
      transform: scale(0.95);
      background: var(--brown-soft);
    }

    .btn-header.active {
      background: var(--vermilion-soft);
      border-color: var(--vermilion-border);
      color: var(--vermilion);
    }
    .btn-header.active svg {
      stroke: var(--vermilion);
    }

    /* 主体容器限制在 100% 宽度，消除任何横向撑破 */
    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 10px 12px;
      box-sizing: border-box;
    }

    /* 底部悬浮控制台 - 坚固 Fixed 布局，精调 375px 移动端防溢出 */
    .player-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
      padding: 7px 10px calc(7px + var(--safe-bottom));
      box-sizing: border-box;
    }

    .dock-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      width: 100%;
    }

    .time-lbl {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-light);
      min-width: 34px;
      font-weight: 600;
      line-height: 1;
    }

    .time-lbl.right {
      text-align: right;
    }

    .progress-bar-bg {
      flex: 1;
      height: 6px;
      background: #e6e0d5;
      border-radius: 3px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      touch-action: none;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--vermilion), #d65244);
      border-radius: 3px;
      transition: width 0.1s linear;
      position: relative;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      width: 100%;
    }

    .sub-btn-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .main-btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(3px, 1.8vw, 10px);
      flex: 1;
      min-width: 0;
    }

    .dock-btn {
      background: transparent;
      border: none;
      color: var(--brown-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      transition: all 0.15s;
      touch-action: manipulation;
    }

    .dock-btn.text-btn {
      padding: 4px 7px;
      background: #f5f2eb;
      border: 1px solid var(--border-color);
      color: var(--brown-main);
      border-radius: 10px;
      font-size: 11.5px;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .dock-btn.text-btn.active {
      background: var(--vermilion-soft);
      border-color: var(--vermilion-border);
      color: var(--vermilion);
    }

    /* 播放大按钮：消除点击死区与触摸穿透 */
    .play-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      background: var(--vermilion);
      color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 3px 12px rgba(179, 57, 47, 0.32);
      flex-shrink: 0;
      cursor: pointer;
      pointer-events: auto;
      position: relative;
    }

    .play-btn svg {
      pointer-events: none;
    }

    .play-btn:active {
      transform: scale(0.92);
    }

    .skip-btn {
      width: 32px;
      height: 32px;
      min-width: 32px;
      color: var(--brown-main);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .skip-btn svg {
      pointer-events: none;
    }

    .skip-btn:active {
      transform: scale(0.90);
    }

    /* 多期目录抽屉弹窗 (Day Drawer Modal) */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 75vh;
      background: #ffffff;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 18px 18px calc(24px + var(--safe-bottom));
      z-index: 501;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
    }

    .drawer-overlay.open .drawer-panel {
      transform: translateY(0);
    }

    .drawer-handle {
      width: 36px;
      height: 4px;
      background: #d8d2c5;
      border-radius: 2px;
      margin: 0 auto 14px;
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .drawer-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .drawer-close {
      background: #f0ece3;
      border: none;
      color: var(--brown-main);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    
    /* 专栏分类筛选与徽章 */
    .drawer-filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap; gap: 6px;
    }
    .drawer-tab {
      background: #f7f4ee;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .drawer-tab.active {
      background: var(--vermilion);
      border-color: var(--vermilion);
      color: #ffffff;
    }
    .drawer-item-topline {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .drawer-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 6px;
      letter-spacing: 0.2px;
      line-height: 1.4;
    }
    .drawer-pill.tuijie {
      background: #fff0ed;
      color: #c93b2b;
      border: 1px solid #f8c9c4;
    }
    .drawer-pill.hanxue {
      background: #f5efe6;
      color: #6e4027;
      border: 1px solid #dec8b5;
    }

    .drawer-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 10px;
    }

    .drawer-item {
      background: #faf8f5;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .drawer-item:active {
      transform: scale(0.98);
    }

    .drawer-item.current {
      background: #fff8f5;
      border-color: var(--vermilion);
      box-shadow: 0 2px 10px rgba(179, 57, 47, 0.08);
    }

    .drawer-item-day {
      font-size: 12px;
      font-weight: 700;
      color: var(--brown-main);
      margin-bottom: 2px;
    }

    .drawer-item-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .drawer-item-desc {
      font-size: 12px;
      color: var(--text-light);
    }

    .drawer-item-meta {
      text-align: right;
      min-width: 60px;
    }

    .drawer-item-dur {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
    }

    .toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(36, 33, 30, 0.9);
      color: #ffffff;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 侧边抽屉底栏与版本徽章 */
    .drawer-footer {
      padding: 10px 4px 2px 4px;
      margin-top: 6px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-version-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      background: var(--bg-para);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      font-size: 11.5px;
      color: var(--text-sub);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .app-version-badge:hover, .app-version-badge:active {
      background: var(--brown-soft);
      border-color: var(--brown-border);
      color: var(--brown-dark);
    }

    .app-version-badge .version-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2e7d32;
      flex-shrink: 0;
      display: inline-block;
    }

    .app-version-badge.has-update .version-dot {
      background: var(--vermilion);
      box-shadow: 0 0 6px rgba(166, 64, 42, 0.6);
      animation: pulseUpdate 1.5s infinite;
    }

    @keyframes pulseUpdate {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    /* 顶部新版本提醒浮动胶囊 */
    .update-banner-pill {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      background: rgba(44, 36, 29, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fdfaf3;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 24px;
      box-shadow: 0 10px 28px rgba(44, 36, 29, 0.35);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      z-index: 10000;
      cursor: pointer;
      user-select: none;
      animation: slideDownFade 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .update-banner-pill:active {
      transform: translateX(-50%) scale(0.97);
    }

    .update-banner-pill .pill-icon-spin {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f7a072;
      animation: rotateIcon 2.5s linear infinite;
    }

    @keyframes rotateIcon {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes slideDownFade {
      from { opacity: 0; transform: translateX(-50%) translateY(-16px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
<body>

  <!-- 浮动更新提示胶囊 -->
  <div class="update-banner-pill" id="updateBannerPill" onclick="applyAppUpdate()" style="display:none;">
    <div class="pill-icon-spin">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
    </div>
    <span id="updateBannerText">发现新版本 · 点击立即更新</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </div>

  <!-- 顶部状态栏 -->
  <header class="header-bar">
    <div class="header-left" id="btnOpenDrawer" title="点击切换天数">
      <div class="header-badge">
        <svg class="svg-icon svg-fill-brown" width="10" height="10" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
        <span id="headerBadgeText">2027 腿姐冲刺带背</span>
      </div>
      <button class="header-day-select">
        <span id="headerDayTitle">DAY 01 · 马原专题一、二</span>
        <!-- 棕色 Chevron 下拉图标 -->
        <svg class="svg-icon svg-stroke-brown" width="13" height="13" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>
        <div class="header-actions">
      <!-- 字号调节循环按钮 -->
      <button class="btn-header" id="btnFontToggle" title="切换字号大小 (14/16/18/20px)">
        <svg class="svg-icon svg-stroke-brown" width="13" height="13" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12"></path>
          <line x1="4" y1="13" x2="20" y2="13"></line>
        </svg>
        <span id="fontScaleText">16px</span>
      </button>

      <!-- 填空自测模式开关 -->
      <button class="btn-header" id="btnTestMode" title="开启填空自测模式">
        <svg class="svg-icon svg-stroke-brown" width="13" height="13" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span id="testModeText">自测</span>
      </button>

      <!-- 棕色 跟随图标 -->
      <button class="btn-header" id="btnScrollToggle" title="切换自动滚屏居中">
        <svg class="svg-icon svg-stroke-brown" width="13" height="13" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span id="scrollStatusText">跟随</span>
      </button>

      <!-- 棕色 目录书本图标 -->
      <button class="btn-header" id="btnDrawerTrigger">
        <svg class="svg-icon svg-stroke-brown" width="13" height="13" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>目录</span>
      </button>
    </div>
  </header>

  <!-- 正文核心区域 -->
  <main class="container" id="contentArea">

    <div class="hero-card">

  <!-- 载入多天聚合数据库 -->
  <script src="data/database.js"></script>

  <script>
    const DB = window.RECITE_DATABASE || { manifest: [], days: {} };

    let currentDayId = "tj_d01";
    let currentDayData = DB.days[currentDayId] || null;

    const audio = document.getElementById("audioEngine");
    const cardsListEl = document.getElementById("cardsList");
    const headerDayTitle = document.getElementById("headerDayTitle");
    const heroTitle = document.getElementById("heroTitle");
    const heroDesc = document.getElementById("heroDesc");
    const btnPlay = document.getElementById("btnPlay");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const progressBarBg = document.getElementById("progressBarBg");
    const progressBarFill = document.getElementById("progressBarFill");
    const currTimeLbl = document.getElementById("currTimeLbl");
    const totalTimeLbl = document.getElementById("totalTimeLbl");
    const btnSpeed = document.getElementById("btnSpeed");
    const btnLoop = document.getElementById("btnLoop");
    const loopText = document.getElementById("loopText");
    const btnBack15 = document.getElementById("btnBack15");
    const btnFwd15 = document.getElementById("btnFwd15");
    const btnScrollToggle = document.getElementById("btnScrollToggle");
    const scrollStatusText = document.getElementById("scrollStatusText");
    const btnLocate = document.getElementById("btnLocate");
    const toast = document.getElementById("toastMsg");

    const drawerOverlay = document.getElementById("drawerOverlay");
    const drawerList = document.getElementById("drawerList");
    const btnOpenDrawer = document.getElementById("btnOpenDrawer");
    const btnDrawerTrigger = document.getElementById("btnDrawerTrigger");
    const btnCloseDrawer = document.getElementById("btnCloseDrawer");

    let isAutoScrollEnabled = true;
    let loopMode = "none";
    let repeatRange = null;
    let currentActiveCard = null;
    let currentActivePara = null;
    let currentActiveSent = null;
    const speeds = [0.8, 1.0, 1.25, 1.5, 2.0];
    let speedIdx = 1;

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    

    function openDrawer() {
      renderDrawer();
      drawerOverlay.classList.add("open");
    }

    function closeDrawer() {
      drawerOverlay.classList.remove("open");
    }

    btnOpenDrawer.addEventListener("click", openDrawer);
    btnDrawerTrigger.addEventListener("click", openDrawer);
    btnCloseDrawer.addEventListener("click", closeDrawer);
    drawerOverlay.addEventListener("click", (e) => {
      if (e.target === drawerOverlay) closeDrawer();
    });

// ==================== 1. 考研重点词库与自测挖空引擎 ====================
    const CORE_KEYWORDS = ['第一个纲领', '最高纲领', '最低纲领', '第一部党章', '反帝反封建', '无产阶级专政', '资本家私有制', '社会主义和共产主义', '民主联合战线', '独立性', '第一次国共合作', '新三民主义', '基本一致', '完全相同', '三大革命政策', '联俄、联共、扶助农工', '耕者有其田', '领导权和工农联盟', '八七会议', '须知政权是由枪杆子中取得的', '枪杆子中取得', '古田会议', '思想建党、政治建军', '思想建党', '政治建军', '执行革命的政治任务的武装集团', '打仗、筹款', '群众工作', '遵义会议', '生死攸关', '军事问题和组织问题', '政治上开始走向成熟', '第一代中央领导集体', '王明“左”倾教条主义', '瓦窑堡会议', '把朋友搞得多多的', '抗日民族统一战线', '关门主义', '人民共和国', '工农共和国', '洛川会议', '抗日救国十大纲领', '全面的全民族抗战', '全国总动员', '山地游击战', '六届六中全会', '马克思主义中国化', '客观实在性', '世界的物质性', '主观能动性', '对立统一', '量变与质变', '肯定与否定', '真理的客观性', '实践是检验真理的唯一标准', '社会存在', '社会意识', '生产力与生产关系', '经济基础与上层建筑'];

    // 本地收藏夹与字号存储
    let starredSentences = JSON.parse(localStorage.getItem("recite_starred_sentences") || "[]");
    let currentFontScaleIdx = parseInt(localStorage.getItem("recite_font_scale_idx") || "1");
    const FONT_SCALES = [
      { size: "14px", label: "小号", lh: "1.75" },
      { size: "16px", label: "标准", lh: "1.85" },
      { size: "18px", label: "大号", lh: "1.9" },
      { size: "20px", label: "特大", lh: "1.95" }
    ];

    function applyFontScale(idx) {
      currentFontScaleIdx = (idx + FONT_SCALES.length) % FONT_SCALES.length;
      const s = FONT_SCALES[currentFontScaleIdx];
      document.documentElement.style.setProperty("--font-scale", s.size);
      document.documentElement.style.setProperty("--font-line-height", s.lh);
      const fontTextEl = document.getElementById("fontScaleText");
      if (fontTextEl) fontTextEl.innerText = s.size;
      localStorage.setItem("recite_font_scale_idx", currentFontScaleIdx);
    }

    // 句子文本增强：挖空标记、高亮与收藏星标
    function enrichSentenceText(text, dayId, cardId, sentIdx) {
      let enriched = text;
      // 匹配核心关键词并包裹为可挖空 token
      CORE_KEYWORDS.forEach(kw => {
        if (enriched.includes(kw)) {
          const regex = new RegExp(`(${kw})`, 'g');
          enriched = enriched.replace(regex, `<span class="cloze-word" onclick="toggleClozeReveal(this, event)">$1</span>`);
        }
      });
      return enriched;
    }

    window.toggleClozeReveal = function(el, e) {
      if (!document.body.classList.contains("cloze-mode")) return;
      e.stopPropagation();
      el.classList.toggle("revealed");
    };

    // 收藏星标切换
    window.toggleStarSent = function(sentKey, sentText, e) {
      e.stopPropagation();
      const idx = starredSentences.findIndex(x => x.key === sentKey);
      if (idx >= 0) {
        starredSentences.splice(idx, 1);
        showToast("已取消收藏此金句");
      } else {
        starredSentences.push({
          key: sentKey,
          text: sentText,
          dayId: currentDayId,
          dayTitle: currentDayData ? currentDayData.title : "",
          speaker: currentDayData ? currentDayData.speaker : "",
          st: parseFloat(e.currentTarget.dataset.st || 0)
        });
        showToast("已收藏至【重点金句本】⭐");
      }
      localStorage.setItem("recite_starred_sentences", JSON.stringify(starredSentences));
      updateStarIcons();
      if (currentDrawerFilter === 'starred') renderDrawer();
    };

    function updateStarIcons() {
      document.querySelectorAll(".btn-star-sent").forEach(btn => {
        const key = btn.dataset.key;
        const isStarred = starredSentences.some(x => x.key === key);
        btn.classList.toggle("active", isStarred);
      });
    }

    // ==================== 2. 渲染指定天数的卡片与正文 ====================
    function loadDay(dayId) {
      currentDayId = dayId;
      currentDayData = DB.days[dayId];
      if (!currentDayData) return;

      const headerBadge = document.getElementById("headerBadgeText");
      if (headerBadge) {
        headerBadge.innerText = currentDayData.series === "tuijie" ? "2027 腿姐冲刺抢分带背" : "2027 肖秀荣背诵手册";
      }

      const pureTitle = (currentDayData.title || '').replace(/^DAY\s*\d+\s*[·•\s]*/i, '').trim();
      headerDayTitle.innerText = `${currentDayData.day || ''} · ${pureTitle}`;
      heroTitle.innerText = `${currentDayData.sub || currentDayData.title} 全程原声`;
      const speaker = currentDayData.speaker || (currentDayData.series === 'tuijie' ? '腿姐 (陆寓丰)' : '韩雪老师');
      heroDesc.innerHTML = `主讲：${speaker} · 全长 ${formatTime(currentDayData.duration)} · 共 ${currentDayData.cards.length} 核心考点模块`;

      // 组装卡片 HTML（嵌入背诵手卷直达入口与循环图标）
      cardsListEl.innerHTML = currentDayData.cards.map((c, cIdx) => `
        <article class="recite-card" id="${c.id}" data-start="${c.start}" data-end="${c.end}">
          <div class="card-top">
            <div class="card-meta">
              <span class="tag-badge">${c.tag}</span>
              <span class="time-badge">
                <svg class="svg-icon svg-stroke-brown" width="11" height="11" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                ${formatTime(c.start)} - ${formatTime(c.end)}
              </span>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              <!-- 直达背诵手卷对应考点入口 -->
              <a class="btn-handbook-link" href="https://ylhyc.github.io/-1/handbook/?search=${encodeURIComponent(c.tag.replace(/【.*?】/g, ''))}" target="_blank" title="直达《背诵手卷》体系研读">
                <svg class="svg-icon svg-stroke-brown" width="10" height="10" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                手卷考点
              </a>
              <button class="btn-repeat" onclick="setCardLoop('${c.id}')">
                <svg class="svg-icon svg-stroke-brown" width="11" height="11" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                单章循环
              </button>
            </div>
          </div>
          <div class="card-title">${c.title}</div>
          <div class="card-sub">${c.sub}</div>
          <div class="card-body">
            ${c.paras.map((p, pIdx) => `
              <div class="para-item" data-pst="${p.st}" data-pet="${p.et}">
                <div class="para-head">
                  <span class="para-lead">
                    <span class="para-lead-icon"></span>
                    ${p.lead}
                  </span>
                  <span class="para-time">${formatTime(p.st)} - ${formatTime(p.et)}</span>
                </div>
                <div class="para-text">
                  ${p.sentences.map((s, sIdx) => {
                    const sentKey = `${currentDayId}_${c.id}_p${pIdx}_s${sIdx}`;
                    const isStarred = starredSentences.some(x => x.key === sentKey);
                    return `
                      <span class="sent" data-st="${s.st}" data-et="${s.et}">
                        ${enrichSentenceText(s.text, currentDayId, c.id, sIdx)}
                        <span class="btn-star-sent ${isStarred ? 'active' : ''}" data-key="${sentKey}" data-st="${s.st}" onclick="toggleStarSent('${sentKey}', '${s.text.replace(/'/g, "\'")}', event)" title="收藏金句">
                          <svg class="svg-icon" width="11" height="11" viewBox="0 0 24 24" stroke-width="2" stroke="#b3392f" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        </span>
                      </span>
                    `;
                  }).join("")}
                </div>
              </div>
            `).join("")}
          </div>
        </article>
      `).join("");

      // 绑定点句即播
      document.querySelectorAll(".sent").forEach(s => {
        s.addEventListener("click", (e) => {
          if (e.target.closest(".btn-star-sent") || e.target.closest(".cloze-word")) return;
          e.stopPropagation();
          const st = parseFloat(s.dataset.st);
          audio.currentTime = st;
          if (audio.paused) audio.play();
          showToast(`跳转到 ${formatTime(st)}`);
        });
      });

      audio.src = currentDayData.audioUrl;

      audio.onerror = () => {
        if (currentDayData && currentDayData.id.startsWith("tj_") && !audio.src.includes("/audio/")) {
          console.warn("Audio CDN failed, falling back to local audio file...");
          audio.src = `audio/tuijie_${currentDayData.id.replace('tj_', '').toUpperCase()}.mp3`;
          audio.load();
          if (!audio.paused) audio.play().catch(e => console.log(e));
        }
      };
    
      totalTimeLbl.innerText = formatTime(currentDayData.duration);
      currTimeLbl.innerText = "00:00";
      progressBarFill.style.width = "0%";
      currentActiveCard = null;
      currentActivePara = null;
      currentActiveSent = null;

      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: currentDayData.title,
          artist: currentDayData.speaker || "考研政治名师带背",
          album: currentDayData.series === "tuijie" ? "2027腿姐冲刺背诵手册" : "2027肖秀荣背诵手册",
          artwork: [
            { src: "icons/icon-512.png", sizes: "512x512", type: "image/png" },
            { src: "icons/apple-touch-icon.png", sizes: "180x180", type: "image/png" }
          ]
        });
      }
    }

    // ==================== 3. 抽屉即时搜索与专栏分类 ====================
    let currentDrawerFilter = 'all';
    let drawerSearchQuery = '';

    window.setDrawerFilter = function(filter, btn) {
      currentDrawerFilter = filter;
      document.querySelectorAll('#drawerFilterBar .drawer-tab').forEach(t => t.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderDrawer();
    };

    const drawerSearchInput = document.getElementById("drawerSearchInput");
    const drawerSearchClear = document.getElementById("drawerSearchClear");

    if (drawerSearchInput) {
      drawerSearchInput.addEventListener("input", (e) => {
        drawerSearchQuery = e.target.value.trim().toLowerCase();
        if (drawerSearchClear) {
          drawerSearchClear.style.display = drawerSearchQuery ? "block" : "none";
        }
        renderDrawer();
      });
    }

    if (drawerSearchClear) {
      drawerSearchClear.addEventListener("click", () => {
        drawerSearchInput.value = '';
        drawerSearchQuery = '';
        drawerSearchClear.style.display = "none";
        renderDrawer();
      });
    }

    function renderDrawer() {
      // 1. 如果是收藏夹模式
      if (currentDrawerFilter === 'starred') {
        if (!starredSentences.length) {
          drawerList.innerHTML = `<div style="text-align:center; padding:30px 10px; color:var(--text-light); font-size:13px;">暂无收藏金句<br>在正文中点击句子末尾的 ⭐ 即可收藏难点</div>`;
          return;
        }
        drawerList.innerHTML = starredSentences.map((item, idx) => `
          <div class="drawer-item" onclick="jumpToStarred('${item.dayId}', ${item.st})">
            <div style="flex:1; min-width:0;">
              <div class="drawer-item-topline">
                <span class="drawer-pill tuijie">重点金句</span>
                <span class="drawer-item-day">${item.dayTitle} · ${item.speaker}</span>
              </div>
              <div class="drawer-item-title" style="font-size:13.5px; font-weight:normal; line-height:1.5;">“${item.text}”</div>
            </div>
            <div class="drawer-item-meta">
              <div class="drawer-item-dur">${formatTime(item.st)}</div>
            </div>
          </div>
        `).join("");
        return;
      }

      // 2. 正常目录或搜索匹配
      let items = DB.manifest.filter(item => {
        if (currentDrawerFilter !== 'all' && item.series !== currentDrawerFilter) {
          return false;
        }
        if (!drawerSearchQuery) return true;
        // 匹配日历、标题、描述
        const matchMeta = (item.day + item.title + item.desc + item.speaker).toLowerCase().includes(drawerSearchQuery);
        if (matchMeta) return true;
        // 深入匹配该天所有卡片与句子
        const dayObj = DB.days[item.id];
        if (dayObj && dayObj.cards) {
          return dayObj.cards.some(c => 
            c.title.toLowerCase().includes(drawerSearchQuery) ||
            c.sub.toLowerCase().includes(drawerSearchQuery) ||
            c.paras.some(p => p.sentences.some(s => s.text.toLowerCase().includes(drawerSearchQuery)))
          );
        }
        return false;
      });

      if (!items.length) {
        drawerList.innerHTML = `<div style="text-align:center; padding:30px 10px; color:var(--text-light); font-size:13px;">没有找到匹配 “${drawerSearchQuery}” 的带背内容</div>`;
        return;
      }

      drawerList.innerHTML = items.map(item => `
        <div class="drawer-item ${item.id === currentDayId ? 'current' : ''}" onclick="switchDay('${item.id}')">
          <div style="flex: 1; min-width: 0;">
            <div class="drawer-item-topline">
              <span class="drawer-pill ${item.series || 'hanxue'}">${item.badge || (item.series === 'tuijie' ? '腿姐冲刺' : '肖秀荣精读')}</span>
              <span class="drawer-item-day">${item.day} · ${item.pages}</span>
            </div>
            <div class="drawer-item-title">${item.title}</div>
            <div class="drawer-item-desc">${item.desc}</div>
          </div>
          <div class="drawer-item-meta">
            <div class="drawer-item-dur">
              <svg class="svg-icon svg-stroke-brown" width="11" height="11" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              ${item.duration}
            </div>
          </div>
        </div>
      `).join("");
    }

    window.jumpToStarred = function(dayId, st) {
      closeDrawer();
      if (dayId !== currentDayId) {
        loadDay(dayId);
      }
      setTimeout(() => {
        audio.currentTime = st;
        audio.play().catch(e => console.log(e));
        showToast(`已跳转至收藏点: ${formatTime(st)}`);
      }, 300);
    };

    // ==================== 4. 视线黄金区域居中算法 (Golden Center Auto-Scroll) ====================
    function scrollSentenceIntoOptimalView(sentEl) {
      if (!isAutoScrollEnabled || !sentEl) return;
      const headerHeight = 60;
      const dockHeight = 136;
      const visibleHeight = window.innerHeight - headerHeight - dockHeight;
      const targetY = headerHeight + visibleHeight * 0.38; // 停留于黄金视线区
      
      const rect = sentEl.getBoundingClientRect();
      const currentY = rect.top + rect.height / 2;
      const diff = currentY - targetY;
      
      if (Math.abs(diff) > 25) {
        window.scrollBy({ top: diff, behavior: "smooth" });
      }
    }

    // ==================== 5. 切天与连播控制 ====================
    function getAdjacentDayId(direction) {
      const idx = DB.manifest.findIndex(x => x.id === currentDayId);
      if (idx === -1) return null;
      const nextIdx = idx + direction;
      if (nextIdx >= 0 && nextIdx < DB.manifest.length) {
        return DB.manifest[nextIdx].id;
      }
      return null;
    }

    const btnPrevDay = document.getElementById("btnPrevDay");
    const btnNextDay = document.getElementById("btnNextDay");

    if (btnPrevDay) {
      btnPrevDay.addEventListener("click", () => {
        const prevId = getAdjacentDayId(-1);
        if (prevId) {
          switchDay(prevId);
        } else {
          showToast("已经是第一期了");
        }
      });
    }

    if (btnNextDay) {
      btnNextDay.addEventListener("click", () => {
        const nextId = getAdjacentDayId(1);
        if (nextId) {
          switchDay(nextId);
        } else {
          showToast("已是最新一期");
        }
      });
    }

    // 播放完毕自动连播下一期
    audio.addEventListener("ended", () => {
      const nextId = getAdjacentDayId(1);
      if (nextId && loopMode === "none") {
        showToast("本期播放完毕，即将进入下一期...");
        setTimeout(() => switchDay(nextId), 1500);
      }
    });

    // ==================== 6. 顶栏按钮交互绑定 ====================
    // 字号调节
    const btnFontToggle = document.getElementById("btnFontToggle");
    if (btnFontToggle) {
      btnFontToggle.addEventListener("click", () => {
        applyFontScale(currentFontScaleIdx + 1);
        showToast(`字号已调整: ${FONT_SCALES[currentFontScaleIdx].label} (${FONT_SCALES[currentFontScaleIdx].size})`);
      });
    }

    // 填空自测模式
    const btnTestMode = document.getElementById("btnTestMode");
    if (btnTestMode) {
      btnTestMode.addEventListener("click", () => {
        const isCloze = document.body.classList.toggle("cloze-mode");
        btnTestMode.classList.toggle("active", isCloze);
        const testText = document.getElementById("testModeText");
        if (testText) testText.innerText = isCloze ? "显隐" : "自测";
        if (isCloze) {
          // 重置所有遮挡块为遮蔽状态
          document.querySelectorAll(".cloze-word").forEach(w => w.classList.remove("revealed"));
          showToast("已开启填空自测模式：轻触词块查看答案");
        } else {
          showToast("已退出自测，恢复全文呈现");
        }
      });
    }

    // 切换天数
    window.switchDay = function(dayId) {
      if (dayId === currentDayId) {
        closeDrawer();
        return;
      }
      closeDrawer();
      const wasPlaying = !audio.paused;
      loadDay(dayId);
      if (wasPlaying) {
        audio.play().catch(e => console.log(e));
      }
      showToast(`已切换至 ${currentDayData.day || dayId}`);
    };

    // ==================== 7. 播放控制与音视频核心引擎 ====================
    let isUserInteracting = false;
    let interactionTimer = null;

    // 用户手动滚动/触摸时，暂时暂停自动跟随2.5秒，避免页面与用户抢夺控制权
    window.addEventListener("touchstart", () => {
      isUserInteracting = true;
      clearTimeout(interactionTimer);
      interactionTimer = setTimeout(() => { isUserInteracting = false; }, 2500);
    }, { passive: true });

    window.addEventListener("wheel", () => {
      isUserInteracting = true;
      clearTimeout(interactionTimer);
      interactionTimer = setTimeout(() => { isUserInteracting = false; }, 2500);
    }, { passive: true });

    function updatePlayState(isPlaying) {
      if (playIcon) playIcon.style.display = isPlaying ? "none" : "block";
      if (pauseIcon) pauseIcon.style.display = isPlaying ? "block" : "none";
    }

    function togglePlay() {
      if (!audio.src) {
        if (currentDayData) {
          audio.src = currentDayData.audioUrl;
        } else {
          showToast("请先选择带背期数");
          return;
        }
      }

      if (audio.paused) {
        const p = audio.play();
        if (p !== undefined) {
          p.then(() => {
            updatePlayState(true);
          }).catch(err => {
            console.warn("Play error, trying fallback:", err);
            // 本地同源音频双重兜底
            if (currentDayData && currentDayData.id.startsWith("tj_") && !audio.src.includes("/audio/")) {
              audio.src = `audio/tuijie_${currentDayData.id.replace('tj_', '').toUpperCase()}.mp3`;
              audio.play().then(() => updatePlayState(true)).catch(() => {
                showToast("音频加载中，请再次点击播放");
              });
            } else {
              showToast("点击播放");
            }
          });
        }
      } else {
        audio.pause();
        updatePlayState(false);
      }
    }

    if (btnPlay) {
      btnPlay.addEventListener("click", togglePlay);
    }

    if (btnBack15) {
      btnBack15.addEventListener("click", () => {
        audio.currentTime = Math.max(0, audio.currentTime - 15);
        showToast("后退 15 秒");
      });
    }

    if (btnFwd15) {
      btnFwd15.addEventListener("click", () => {
        const total = audio.duration || (currentDayData ? currentDayData.duration : 1800);
        audio.currentTime = Math.min(total, audio.currentTime + 15);
        showToast("快进 15 秒");
      });
    }

    if (btnSpeed) {
      btnSpeed.addEventListener("click", () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        const spd = speeds[speedIdx];
        audio.playbackRate = spd;
        btnSpeed.innerText = spd + "x";
        showToast(`语速: ${spd}x`);
      });
    }

    window.setCardLoop = function(cardId) {
      const card = document.getElementById(cardId);
      if (!card) return;
      const s = parseFloat(card.dataset.start);
      const e = parseFloat(card.dataset.end);
      repeatRange = [s, e];
      loopMode = "card";
      if (btnLoop) btnLoop.classList.add("active");
      if (loopText) loopText.innerText = "单章";
      audio.currentTime = s;
      if (audio.paused) audio.play().catch(e => console.log(e));
      showToast("已开启本章循环复读");
    };

    if (btnLoop) {
      btnLoop.addEventListener("click", () => {
        if (loopMode === "none") {
          if (currentActiveCard) {
            setCardLoop(currentActiveCard.id);
          } else {
            showToast("请先播放某个考点模块");
          }
        } else {
          loopMode = "none";
          repeatRange = null;
          btnLoop.classList.remove("active");
          if (loopText) loopText.innerText = "全篇";
          showToast("已恢复连续播放");
        }
      });
    }

    // 进度条拖拽寻轨
    function seekByEvent(e) {
      if (!progressBarBg) return;
      const rect = progressBarBg.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const total = audio.duration || (currentDayData ? currentDayData.duration : 1800);
      audio.currentTime = pct * total;
    }

    if (progressBarBg) {
      progressBarBg.addEventListener("click", seekByEvent);
      progressBarBg.addEventListener("touchstart", (e) => {
        seekByEvent(e);
        const onMove = (ev) => seekByEvent(ev);
        const onEnd = () => {
          window.removeEventListener("touchmove", onMove);
          window.removeEventListener("touchend", onEnd);
        };
        window.addEventListener("touchmove", onMove, { passive: true });
        window.addEventListener("touchend", onEnd, { once: true });
      }, { passive: true });
    }

    // 跟随开关
    if (btnScrollToggle) {
      btnScrollToggle.addEventListener("click", () => {
        isAutoScrollEnabled = !isAutoScrollEnabled;
        if (scrollStatusText) scrollStatusText.innerText = isAutoScrollEnabled ? "跟随" : "锁定";
        btnScrollToggle.classList.toggle("active", isAutoScrollEnabled);
        showToast(isAutoScrollEnabled ? "开启自动跟随" : "已锁定手动滚动");
      });
    }

    // 定位当前句
    if (btnLocate) {
      btnLocate.addEventListener("click", () => {
        if (currentActiveSent) {
          const targetY = window.pageYOffset + currentActiveSent.getBoundingClientRect().top - (window.innerHeight * 0.35);
          window.scrollTo({ top: Math.max(0, targetY), behavior: "smooth" });
          showToast("已定位至当前朗读句");
        } else if (currentActiveCard) {
          const targetY = window.pageYOffset + currentActiveCard.getBoundingClientRect().top - (window.innerHeight * 0.35);
          window.scrollTo({ top: Math.max(0, targetY), behavior: "smooth" });
        }
      });
    }

    // ==================== 8. 音频事件与毫秒级高精度跟随 ====================
    audio.addEventListener("timeupdate", () => {
      const curr = audio.currentTime;
      const total = audio.duration || (currentDayData ? currentDayData.duration : 1800);

      if (progressBarFill) progressBarFill.style.width = ((curr / total) * 100) + "%";
      if (currTimeLbl) currTimeLbl.innerText = formatTime(curr);
      if (totalTimeLbl) totalTimeLbl.innerText = formatTime(total);

      // 单章循环复读
      if (loopMode === "card" && repeatRange) {
        if (curr >= repeatRange[1]) {
          audio.currentTime = repeatRange[0];
          return;
        }
      }

      // 1. 匹配当前卡片
      const cards = document.querySelectorAll(".recite-card");
      let activeCard = null;
      for (const card of cards) {
        const s = parseFloat(card.dataset.start);
        const e = parseFloat(card.dataset.end);
        if (curr >= s && curr < e) {
          activeCard = card;
          break;
        }
      }
      if (activeCard && activeCard !== currentActiveCard) {
        if (currentActiveCard) currentActiveCard.classList.remove("active");
        activeCard.classList.add("active");
        currentActiveCard = activeCard;
      }

      // 2. 匹配当前段落
      const paras = document.querySelectorAll(".para-item");
      let activePara = null;
      for (const p of paras) {
        const s = parseFloat(p.dataset.pst);
        const e = parseFloat(p.dataset.pet);
        if (curr >= s && curr < e) {
          activePara = p;
          break;
        }
      }
      if (activePara && activePara !== currentActivePara) {
        if (currentActivePara) currentActivePara.classList.remove("active-para");
        activePara.classList.add("active-para");
        currentActivePara = activePara;
      }

      // 3. 匹配当前朗读句与无抖动精准居中
      const sents = document.querySelectorAll(".sent");
      let activeSent = null;
      for (const sent of sents) {
        const st = parseFloat(sent.dataset.st);
        const et = parseFloat(sent.dataset.et);
        if (curr >= st && curr < et) {
          activeSent = sent;
          break;
        }
      }

      // 核心优化：仅在当前朗读句发生变更那一瞬触发一次平滑滚动，杜绝抖动抽搐！
      if (activeSent && activeSent !== currentActiveSent) {
        if (currentActiveSent) currentActiveSent.classList.remove("reading");
        activeSent.classList.add("reading");
        currentActiveSent = activeSent;

        // 若开启自动跟随且用户当前未触摸屏幕，执行精准视线居中
        if (isAutoScrollEnabled && !isUserInteracting) {
          const targetY = window.pageYOffset + activeSent.getBoundingClientRect().top - (window.innerHeight * 0.35);
          window.scrollTo({ top: Math.max(0, targetY), behavior: "smooth" });
        }
      }
    });

    audio.addEventListener("play", () => updatePlayState(true));
    audio.addEventListener("pause", () => updatePlayState(false));
    audio.addEventListener("loadedmetadata", () => {
      const dur = audio.duration || (currentDayData ? currentDayData.duration : 1800);
      if (totalTimeLbl) totalTimeLbl.innerText = formatTime(dur);
    });

    // 系统媒体中心控制
    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("play", () => togglePlay());
      navigator.mediaSession.setActionHandler("pause", () => togglePlay());
      navigator.mediaSession.setActionHandler("seekbackward", () => {
        audio.currentTime = Math.max(0, audio.currentTime - 15);
      });
      navigator.mediaSession.setActionHandler("seekforward", () => {
        const total = audio.duration || 1800;
        audio.currentTime = Math.min(total, audio.currentTime + 15);
      });
      navigator.mediaSession.setActionHandler("previoustrack", () => {
        const prevId = getAdjacentDayId(-1);
        if (prevId) switchDay(prevId);
      });
      navigator.mediaSession.setActionHandler("nexttrack", () => {
        const nextId = getAdjacentDayId(1);
        if (nextId) switchDay(nextId);
      });
    }

    // ==================== 11. 自动获取云端更新与版本号体系 (参照 words 规范) ====================
    const APP_BUILD_ID = "1.2.0";
    const APP_BUILD_TS = 1792585400;
    let latestUpdatePayload = null;

    async function checkAppUpdate(isManual = false) {
      const badge = document.getElementById("appVersionBadge");
      const versionText = document.getElementById("versionText");
      if (isManual) {
        showToast("正在检查云端更新…");
        if (versionText) versionText.textContent = "正在检查更新…";
      }
      try {
        const res = await fetch(`version.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("fetch version.json failed");
        const payload = await res.json();
        latestUpdatePayload = payload;

        const remoteTs = Number(payload.built_at || payload.build_ts || 0);
        const remoteVer = String(payload.version || "");
        const isNewer = remoteTs > APP_BUILD_TS || (remoteVer && remoteVer !== APP_BUILD_ID);

        if (isNewer) {
          const banner = document.getElementById("updateBannerPill");
          const bannerText = document.getElementById("updateBannerText");
          if (banner && bannerText) {
            bannerText.textContent = `发现新版本 v${remoteVer} · 点击立即更新`;
            banner.style.display = "flex";
          }
          if (versionText) {
            versionText.textContent = `发现新版 v${remoteVer} · 点击更新`;
          }
          if (badge) {
            badge.classList.add("has-update");
          }
          if (isManual) {
            showToast(`发现新版本 v${remoteVer}，请点击升级！`);
          }
        } else {
          if (versionText) {
            versionText.textContent = `版本 v${APP_BUILD_ID} · 已是最新`;
          }
          if (isManual) {
            showToast("已是最新版本，无需更新");
          }
        }
      } catch (err) {
        console.warn("Update check failed:", err);
        if (versionText) versionText.textContent = `版本 v${APP_BUILD_ID} · 羊皮暖杏`;
        if (isManual) showToast("检查更新超时，请检查网络连接");
      }
    }

    function applyAppUpdate() {
      const ts = (latestUpdatePayload && (latestUpdatePayload.built_at || latestUpdatePayload.build_ts)) || Date.now();
      showToast("正在更新至最新版本…");
      if ("caches" in window) {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(() => {});
      }
      setTimeout(() => {
        const cleanUrl = location.protocol + "//" + location.host + location.pathname;
        location.replace(cleanUrl + "?v=" + ts);
      }, 350);
    }

    // 页面载入 1.2 秒后静默拉取更新，切回前台时自动复查
    setTimeout(() => checkAppUpdate(false), 1200);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        checkAppUpdate(false);
      }
    });

    applyFontScale(currentFontScaleIdx);
    loadDay("tj_d01");
  </script>
</body>
</html>
